<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치/홈바 영역까지 배경이 차게 (현장 모드가 전체화면으로 뜸) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>플렌티컨벤션 운영관리</title>

    <!-- PWA (A6) — 연회·주방이 폰 홈화면에 설치해서 쓴다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6B4A2F" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS 는 manifest 의 display 를 안 보고 아래 메타를 본다 -->
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="플렌티 운영" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
