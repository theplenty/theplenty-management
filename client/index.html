<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치/홈바 영역까지 배경이 차게 (현장 모드가 전체화면으로 뜸) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>플렌티컨벤션 운영관리</title>

    <!-- PWA (A6) — 연회·주방이 폰 홈화면에 설치해서 쓴다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#32513F" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS 는 manifest 의 display·icons 를 안 보고 아래 메타를 본다.
         특히 홈화면 아이콘은 SVG 를 지원하지 않아 PNG 가 반드시 필요하다
         (없으면 페이지 스크린샷이 아이콘 자리에 들어간다). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="플렌티 운영" />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
